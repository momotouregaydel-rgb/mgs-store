/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:env(safe-area-inset-top,0px) 1rem env(safe-area-inset-bottom,0px);text-align:center;transition:opacity .9s,visibility .9s}
#intro.out{opacity:0;visibility:hidden}
#intro .mono{width:min(44vw,200px);clip-path:inset(0 0 100% 0);animation:draw 1.5s .3s cubic-bezier(.6,0,.2,1) forwards,sweep 2.2s 1.2s ease-in-out forwards}
@keyframes draw{to{clip-path:inset(0)}}@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.nm{font:600 clamp(1.2rem,5vw,2rem)/1.2 var(--serif);color:var(--goldtxt);letter-spacing:.7em;padding-left:.7em;opacity:0;animation:nm 1.6s 1.5s ease-out forwards}
@keyframes nm{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.34em}}
.nm small{display:block;font:500 .42em var(--sans);letter-spacing:.3em;margin-top:.8rem;color:var(--mut)}.logo .st{font:600 .5em var(--sans);letter-spacing:.3em;color:var(--mut);margin-left:.1rem}footer .logo .st{color:#e8dfd0}
.ln{width:0;height:1px;background:var(--gold);animation:ln 1s 2.8s ease-out forwards}@keyframes ln{to{width:min(60vw,280px)}}
.sg{font:italic 500 clamp(1.1rem,3.6vw,1.4rem) var(--serif);color:var(--mut);opacity:0;animation:fade 1s 3.2s forwards}@keyframes fade{to{opacity:1}}
#skip{position:absolute;right:1rem;top:calc(env(safe-area-inset-top,0px) + 1rem);min-height:44px;padding:0 1rem;background:none;border:0;color:var(--mut);font:500 .9rem var(--sans)}
/* en-tête */
.top{background:var(--brown);color:#f3ece0;font-size:.8rem}.top .w{display:flex;justify-content:space-between;gap:.4rem 1rem;padding:.5rem 0;flex-wrap:wrap}.top b{color:var(--gold);font-weight:600}
header.h{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:1rem;padding:.6rem 0}
.logo{display:flex;align-items:center;gap:.6rem;font:700 1.5rem var(--serif);letter-spacing:.14em;color:var(--goldtxt)}.logo .mono{width:30px}
.sp{flex:1}
form.s input{width:min(40vw,300px);min-height:44px;padding:0 1.1rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;font:inherit;font-size:.9rem}
.cartb{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--goldtxt);transition:background .2s}
.cartb:hover{background:var(--sand)}.cartb b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--gold);color:#241f19;font-size:.72rem;display:grid;place-items:center;padding:0 4px}
nav.m{display:flex;gap:.2rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding-bottom:.3rem}
nav.m a{display:grid;align-items:center;min-height:44px;padding:0 .9rem;font-size:.86rem;font-weight:500;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav.m a:hover,nav.m a.on{color:var(--goldtxt);border-color:var(--gold)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:0 1.6rem;border-radius:99px;font:700 .9rem var(--sans);background:var(--gold);color:#241f19;border:1.5px solid var(--gold);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(48,43,37,.2)}.btn.o{background:none;color:inherit;border-color:currentColor}.btn.d{background:var(--brown);border-color:var(--brown);color:#f3ece0}
.btn.sm{min-height:44px;padding:0 1rem;font-size:.82rem;border-radius:12px;width:100%}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
/* hero */
.hero{background:radial-gradient(120% 140% at 80% 40%,#4a4136 0%,#302b25 55%,#241f19 100%);color:#f3ece0;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:1rem;min-height:clamp(340px,50vw,500px);padding:1.5rem 0}
.ey{font:700 .72rem var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.hero h1{font:700 clamp(2.4rem,6.4vw,4.8rem)/1.02 var(--serif);margin:.7rem 0}.hero h1 em{display:block;font-style:normal;color:var(--gold)}
.hero p.l{max-width:30rem;opacity:.88;margin-bottom:1.6rem}.hero .bt{display:flex;gap:.8rem;flex-wrap:wrap}
.hero .ph{justify-self:end;width:min(100%,500px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 80%,transparent)}
.hero .ph img{width:100%;aspect-ratio:1;object-fit:cover}
@media (max-width:760px){.hero .w{grid-template-columns:1fr;padding-top:2rem}.hero .ph{justify-self:center}}
.trust{background:var(--tile);border-bottom:1px solid var(--line)}.trust .w{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem 1rem;padding:1.1rem 0}
.trust div{display:flex;gap:.8rem;align-items:center;font-size:.86rem;color:var(--mut)}.trust b{display:block;color:var(--fg);font-size:.92rem}.trust .ic{color:var(--goldtxt);flex:none}
section.s{padding:3.2rem 0}.hd{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.hd h2{font:700 clamp(1.8rem,4vw,2.6rem)/1.1 var(--serif)}.hd h2::before{content:"";display:block;width:44px;height:3px;background:var(--gold);margin-bottom:.6rem}
.hd a{font-size:.88rem;color:var(--goldtxt);font-weight:700}
/* tuiles + cartes */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.cat{display:block;background:var(--tile);border-radius:18px;padding:.8rem;text-align:center;font-weight:600;font-size:.9rem;transition:transform .25s,box-shadow .25s}
.cat:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(48,43,37,.16)}
.cat img,.cat .ci{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:.6rem}.cat .ci{display:grid;place-items:center;background:var(--sand);color:var(--goldtxt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.pc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(48,43,37,.16)}
.pc .im{position:relative;display:block;background:var(--tile)}.pc .im img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .4s}.pc:hover .im img{transform:scale(1.04)}
.pl{aspect-ratio:1;display:grid;place-items:center;background:var(--tile)}.pl .mono{width:34%;opacity:.55}
.bd{position:absolute;top:.6rem;left:.6rem;font:700 .68rem var(--sans);letter-spacing:.06em;background:var(--gold);color:#241f19;padding:.2rem .6rem;border-radius:99px}.bd.s{left:auto;right:.6rem;background:var(--brown);color:#f3ece0}
.bx{padding:.9rem;display:flex;flex-direction:column;gap:.35rem;flex:1}.bx small{color:var(--mut);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase}
.bx .nm2{font-weight:600;font-size:.95rem;line-height:1.3}.bx .pr{color:var(--goldtxt);font-weight:700;font-size:.92rem;margin-bottom:.4rem}.bx .pr s{color:var(--mut);font-weight:400;margin-right:.3rem}.bx .btn{margin-top:auto}
.ban{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.bn{border-radius:22px;padding:2rem;background:var(--brown);color:#f3ece0;display:flex;flex-direction:column;gap:.8rem;align-items:flex-start;min-height:220px;justify-content:center}
.bn.g{background:var(--sand);color:#302b25}.bn h3{font:700 2rem/1.05 var(--serif)}.bn h3 em{font-style:normal;color:var(--gold)}.bn.g h3 em{color:var(--goldtxt)}
@media (max-width:760px){.ban{grid-template-columns:1fr}}
.crumb{font-size:.82rem;color:var(--mut);padding:1rem 0}.crumb a{color:var(--goldtxt);font-weight:600}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}.chips button{min-height:44px;padding:0 1.1rem;border:1px solid var(--line);border-radius:99px;font:500 .86rem var(--sans);background:var(--card);color:var(--fg);transition:background .2s}
.chips button:hover{background:var(--sand)}.chips button.on{background:var(--brown);color:#f3ece0;border-color:var(--brown)}
/* fiche produit */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:2rem;padding-bottom:2rem}.gal{border-radius:22px;overflow:hidden;background:var(--tile);border:1px solid var(--line)}.gal img,.gal .pl{width:100%;aspect-ratio:1;object-fit:cover}
.inf small{color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}.inf h1{font:700 clamp(2rem,4vw,3rem)/1.05 var(--serif);margin:.3rem 0 .8rem}.inf .big{font:700 1.5rem var(--sans);color:var(--goldtxt);margin-bottom:1rem}.inf .big s{color:var(--mut);font-weight:400;font-size:1rem;margin-right:.5rem}
.pts{list-style:none;padding:0;display:grid;gap:.6rem;margin:0 0 1.4rem}.pts li{display:flex;gap:.7rem;align-items:center;font-size:.9rem}.pts .ic{color:var(--goldtxt)}
.inf label{display:block;font-size:.82rem;font-weight:600;margin:.8rem 0 .3rem}
.fld{display:block;width:100%;min-height:48px;margin:.4rem 0;padding:.7rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit}textarea.fld{min-height:96px}
.qty{display:flex;align-items:center;gap:.4rem;margin:1rem 0}.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;color:var(--fg)}.qty b{min-width:2rem;text-align:center}
.act{display:flex;gap:.7rem;flex-wrap:wrap}.act .btn{flex:1 1 200px}
@media (max-width:760px){.pdp{grid-template-columns:1fr}}
/* panier, pages */
.pg{padding:1rem 0 3.5rem}.pg h1{font:700 clamp(2.2rem,5vw,3.4rem)/1.05 var(--serif);text-align:center;margin:.5rem 0 1rem}.box{max-width:680px;margin:0 auto}.pr2{text-align:center;color:var(--mut);max-width:40rem;margin:0 auto 1.5rem}
.row2{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem;margin-bottom:.6rem;flex-wrap:wrap}.row2 img{width:60px;height:60px;object-fit:cover;border-radius:10px}.row2 .t{flex:1;min-width:140px;font-weight:600;font-size:.92rem}.row2 small{display:block;color:var(--mut);font-weight:400}
.mini{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-weight:700;padding:0 .6rem}.mini:hover{background:var(--sand)}
.tot{text-align:center;font-weight:700;font-size:1.1rem;margin:1rem 0}
.phones{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem 2.4rem;margin:1.5rem 0}.phones a{font:700 clamp(1.8rem,6vw,2.6rem)/1.2 var(--serif);color:var(--goldtxt)}
.soc{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.4rem}.soc a,.soc span{border:1px solid var(--line);border-radius:99px;padding:.6rem 1.1rem;font-size:.88rem;background:var(--card)}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.6rem;text-align:center}.vals h3{font:700 1.6rem var(--serif);color:var(--goldtxt)}.vals p{font-size:.92rem;color:var(--mut)}
footer{background:var(--brown);color:#e8dfd0;margin-top:2rem}footer .w{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:2rem;padding:2.6rem 0}
footer h4{font:700 .78rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}footer a,footer span{display:block;padding:.3rem 0;opacity:.88}footer a:hover{opacity:1;color:var(--gold)}
footer .cp{border-top:1px solid rgba(255,255,255,.12);padding:1rem;text-align:center;font-size:.8rem;opacity:.7}
@media (max-width:760px){footer .w{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translate(-50%,2rem);background:var(--brown);color:#f3ece0;padding:.8rem 1.3rem;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none;font-size:.9rem}#toast.s{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}.rv.in{opacity:1;transform:none}
.adm-row{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem;margin-bottom:.5rem}.adm-row img,.adm-row .pl{width:48px;height:48px;border-radius:8px;object-fit:cover}.adm-row .nm3{flex:1 1 180px;min-width:160px}.adm-row .nm3 small{display:block;color:var(--mut);font-size:.72rem}
.fld.sm{margin:0;min-height:44px;padding:.4rem .7rem}.fld.w2{width:96px}.adm-row label{font-size:.8rem;display:flex;align-items:center;gap:.3rem;min-height:44px}
